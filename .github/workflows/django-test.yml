name: Django CI - Tests

on:
  push:
    branches: [main]
    paths:
      - "django/**"
      - ".github/workflows/django-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "django/**"
      - ".github/workflows/django-test.yml"

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: django

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        env:
          SECRET_KEY: django
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: django_db
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_HOST: db
          POSTGRES_PORT: "5432"
        run: |
          cat > .env <<EOF
          SECRET_KEY=$SECRET_KEY
          DEBUG=$DEBUG
          ALLOWED_HOSTS=$ALLOWED_HOSTS
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_HOST=$POSTGRES_HOST
          POSTGRES_PORT=$POSTGRES_PORT
          EOF

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if docker compose exec -T web python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/')" 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Install Requirements
        run: pip install -r requirements/dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Django tests
        run: docker compose exec -T web python manage.py test

      - name: Django system check
        run: docker compose exec -T web python manage.py check

      - name: Check migrations
        run: docker compose exec -T web python manage.py makemigrations --check --dry-run

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          rm -f .env
